name: Sparkle launch regression
on:
  push:
    branches: [fix/sparkle-launch-readiness-20261017]
  pull_request:
    paths: ['what-do-i-say/**', '.github/scripts/*sparkle*', '.github/scripts/free-access-smoke.mjs', '.github/workflows/sparkle-launch-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Protect approved voice and PR9 synthesis
        run: |
          set -euo pipefail
          echo 'b59e9c4d70864fcd0cb0b4e9c5f4a25b4854464e53104b7a6a5449d24a54ea20  what-do-i-say/voice-beta/Sparkle_reference.wav' | sha256sum -c -
          test -z "$(git diff --name-only 63e5c1ee6f2875f8cfecd9b1b3d27f33fa4f3983 HEAD -- what-do-i-say/voice-beta/pocket-tts what-do-i-say/voice-beta/reference-prep.mjs what-do-i-say/voice-beta/Sparkle_reference.wav)"
      - name: Text regression
        run: |
          node .github/scripts/free-access-smoke.mjs
          node .github/scripts/sparkle-message-meaning-test.mjs
      - name: Voice regression
        run: |
          node --check what-do-i-say/voice-beta/lab.js
          node .github/scripts/sparkle-voice-beta-check.mjs
          node .github/scripts/sparkle-voice-reference-prep-check.mjs
          node .github/scripts/sparkle-voice-turn-detection-test.mjs
          node .github/scripts/sparkle-voice-mic-restart-test.mjs
