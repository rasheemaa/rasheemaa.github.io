name: Submit updated pages to IndexNow

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - about.html
      - sitemap.xml
      - robots.txt
      - _config.yml
      - _layouts/post.html
      - _edits/**
      - community/**
      - shop/**
      - what-do-i-say/index.html
      - .github/workflows/indexnow.yml

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages deployment
        run: sleep 60

      - name: Submit public sitemap URLs
        shell: bash
        run: |
          set -euo pipefail

          KEY="b7158b3e51c146fa8bb04efdce4dd21f"
          SITEMAP_URL="https://thesheemaedit.com/sitemap.xml"

          SITEMAP="$(curl --fail --silent --show-error "${SITEMAP_URL}")"
          mapfile -t URLS < <(printf '%s' "${SITEMAP}" | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g')

          if [[ "${#URLS[@]}" -eq 0 ]]; then
            echo "No public URLs found in sitemap."
            exit 1
          fi

          echo "Submitting ${#URLS[@]} public URLs from sitemap."

          for URL in "${URLS[@]}"; do
            STATUS=$(curl --silent --show-error --output /tmp/indexnow-response --write-out "%{http_code}" \
              --get "https://api.indexnow.org/indexnow" \
              --data-urlencode "url=${URL}" \
              --data-urlencode "key=${KEY}")
            echo "${URL} -> HTTP ${STATUS}"
            if [[ "${STATUS}" != "200" && "${STATUS}" != "202" ]]; then
              cat /tmp/indexnow-response || true
              exit 1
            fi
          done
