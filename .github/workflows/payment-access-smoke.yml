name: What Do I Say payment access smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/payment-access-smoke.yml'
      - '.github/scripts/payment-access-smoke.mjs'
      - 'what-do-i-say/index.html'
      - 'what-do-i-say/config.js'
      - 'what-do-i-say/payment-v3.js'
      - 'what-do-i-say/paid-trial-access.js'
      - 'what-do-i-say/chat-app.js'
      - 'what-do-i-say/service-worker.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: what-do-i-say-payment-access-smoke
  cancel-in-progress: true

jobs:
  payment-access-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install exact Playwright version without package lifecycle scripts
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test live paid access boundaries
        run: node .github/scripts/payment-access-smoke.mjs
