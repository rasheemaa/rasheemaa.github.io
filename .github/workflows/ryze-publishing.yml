name: Publish Ryze articles

on:
  push:
    branches: [main]
    paths:
      - blog/data/**
      - .github/scripts/import_ryze.py
      - .github/scripts/test_ryze_import.py
      - .github/workflows/ryze-publishing.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: ryze-publishing-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Verify article import
        run: python3 -m unittest discover -s .github/scripts -p test_ryze_import.py
      - name: Generate article pages
        run: python3 .github/scripts/import_ryze.py
      - name: Commit published pages
        run: |
          git add -- _edits
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish Ryze article pages'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Rebuild the public website
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
