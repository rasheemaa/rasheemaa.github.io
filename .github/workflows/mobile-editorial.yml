name: Mobile editorial refinement
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Capture approved laptop and desktop baseline
        run: node .github/scripts/mobile-verify.mjs before
      - name: Apply mobile-only presentation
        run: |
          python3 .github/scripts/mobile-refine.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/css
          git commit -m 'Refine mobile hierarchy and individual covers; preserve desktop'
          git push
      - name: Request site publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
      - name: Verify live phones and desktop parity
        run: node .github/scripts/mobile-verify.mjs after
      - name: Save completed previews
        if: always()
        run: |
          git add .github/reports/mobile-*.json assets/mobile-previews || true
          git diff --cached --quiet || git commit -m 'Save phone previews and desktop comparison results'
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-editorial-checks
          path: |
            .github/reports
            assets/mobile-previews
