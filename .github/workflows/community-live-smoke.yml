name: Community live smoke

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/community-live-smoke.yml'
      - 'community/**'
      - 'community/firestore.rules'
      - 'assets/js/community.js'
      - 'assets/js/community-seed.js'
      - 'assets/js/community-reference.js'
      - 'assets/css/community-reference.css'
      - 'assets/css/community.css'
      - 'assets/css/community-seed.css'
      - 'assets/community/paws/**'
      - 'assets/js/community-config.js'
      - 'service-worker.js'
  pull_request:
    paths:
      - '.github/workflows/community-live-smoke.yml'
      - 'community/**'
      - 'community/firestore.rules'
      - 'assets/js/community.js'
      - 'assets/js/community-seed.js'
      - 'assets/js/community-reference.js'
      - 'assets/css/community-reference.css'
      - 'assets/css/community-seed.css'
      - 'assets/community/paws/**'
      - 'assets/js/community-config.js'
      - 'service-worker.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  community-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate Community source contract
        shell: bash
        run: |
          set -euo pipefail
          node --check service-worker.js
          node --input-type=module --check < assets/js/community.js
          node --check assets/js/community-seed.js
          node --check assets/js/community-reference.js
          grep -Fq 'id="profile-avatar-input"' community/index.html
          grep -Fq 'id="reference-follower-count"' community/index.html
          grep -Fq 'const resizePhoto = (file) =>' assets/js/community.js
          grep -Fq 'getCountFromServer' assets/js/community.js
          grep -Fq "request.resource.data.get('avatarData', '')" community/firestore.rules
          grep -Fq 'class="reference-stories"' community/index.html
          grep -Fq 'class="reference-bottom-nav"' community/index.html
          grep -Fq 'id="community-self-profile-dialog"' community/index.html
          grep -Fq 'id="community-search-dialog"' community/index.html
          grep -Fq 'id="community-menu-trigger"' community/index.html
          grep -Fq 'community:session' assets/js/community.js
          grep -Fq 'dataset.communityUid' assets/js/community.js
          grep -Fq 'const openProfile = (tab = "posts") =>' assets/js/community-reference.js
          grep -Fq '/* Approved reference direction:' assets/css/community-reference.css
          grep -Fq 'let reactionCheckedPostIds = new Set();' assets/js/community.js
          grep -Fq 'id="auth-age-confirm"' community/index.html
          grep -Fq 'id="auth-age-field" hidden' community/index.html
          grep -Fq 'const updateAgeGateVisibility = () =>' assets/js/community.js
          grep -Fq 'id="community-gif-dialog"' community/index.html
          grep -Fq 'id="community-post-gif-button"' community/index.html
          grep -Fq 'const safeGifUrl = (value = "") =>' assets/js/community.js
          grep -Fq 'id="community-gif-search"' community/index.html
          grep -Fq 'id="community-gif-results"' community/index.html
          grep -Fq 'id="community-gif-source"' community/index.html
          grep -Fq 'giphyApiKey:' assets/js/community-config.js
          grep -Fq 'const loadGiphyGifs = async (queryText = "") =>' assets/js/community.js
          grep -Fq 'https://api.giphy.com/v1/gifs/search' assets/js/community.js
          grep -Fq 'https://api.giphy.com/v1/gifs/trending' assets/js/community.js
          grep -Fq 'comment-gif-trigger' assets/js/community.js
          grep -Fq 'id="profile-neurotype"' community/index.html
          grep -Fq 'id="profile-interest-grid"' community/index.html
          grep -Fq 'id="feed-following"' community/index.html
          grep -Fq 'const neurotypeLabels = {' assets/js/community.js
          grep -Fq 'const toggleConnection = async (authorId) =>' assets/js/community.js
          grep -Fq 'const showAuthenticatedShell = (user) =>' assets/js/community.js
          grep -Fq 'const populateProfileEditor = (profile = currentProfile) =>' assets/js/community.js
          grep -Fq 'async function openProfileEditor()' assets/js/community.js
          if grep -Fq 'const openProfileDialog = () =>' community/index.html; then
            echo 'Duplicate inline profile handler returned.' >&2
            exit 1
          fi
          grep -Fq 'const LOCAL_GIFS = [' assets/js/community.js
          grep -Fq 'const safeVideoId = (raw = "") =>' assets/js/community.js
          grep -Fq 'id="community-post-video-url"' community/index.html
          grep -Fq 'id="community-member-dialog"' community/index.html
          grep -Fq 'id="feed-personal"' community/index.html
          grep -Fq 'data-community-vibe="animals"' community/index.html
          grep -Fq 'community:filter-change' assets/js/community-seed.js
          grep -Fq 'realCards.length ? topicPosts.slice(0, 4)' assets/js/community-seed.js
          grep -Fq "request.resource.data.get('interests', [])" community/firestore.rules
          grep -Fq "request.resource.data.get('followingIds', [])" community/firestore.rules
          grep -Fq 'community-auth-button' community/index.html
          grep -Fq 'edit-profile-button' community/index.html
          grep -Fq 'Loading your profile…' assets/js/community.js
          grep -Fq 'community:open-my-profile' assets/js/community.js
          grep -Fq 'Community profile access is blocked by the database permissions.' assets/js/community.js
          grep -Fq 'data-action="share"' assets/js/community.js
          grep -Fq 'gifUrl ? { gifUrl }' assets/js/community.js
          grep -Fq '18+ only.' community/index.html
          grep -Fq 'You must confirm you are 18 or older to join the Community.' assets/js/community.js
          grep -Fq '/assets/js/community-config.js?v=4' community/index.html
          grep -Fq '/assets/css/community.css?v=14' community/index.html
          grep -Fq '/assets/js/community.js?v=27' community/index.html
          grep -Fq '/assets/css/community-seed.css?v=4' community/index.html
          grep -Fq '/assets/js/community-seed.js?v=7' community/index.html
          grep -Fq 'Sparkle powered account' assets/js/community-seed.js
          grep -Fq 'AI community character powered by Sparkle' assets/js/community-seed.js
          grep -Fq '/assets/community/paws/paws-walk.jpg' assets/js/community-seed.js
          grep -Fq '/assets/community/paws/paws-zoomies.gif' assets/js/community-seed.js
          test -s assets/community/paws/paws-walk.jpg
          test -s assets/community/paws/paws-pillow.jpg
          test -s assets/community/paws/paws-bath.jpg
          test -s assets/community/paws/paws-cheese.jpg
          test -s assets/community/paws/paws-blanket.jpg
          test -s assets/community/paws/paws-beach.jpg
          test -s assets/community/paws/paws-snow.jpg
          test -s assets/community/paws/paws-mood.jpg
          test -s assets/community/paws/paws-zoomies.gif
          test -s assets/community/paws/paws-treat.gif
          test -s assets/community/paws/paws-shake.gif
          grep -Fq '/* Social app refresh v3 */' assets/css/community.css
          grep -Fq 'const CACHE_NAME = "sheema-edit-v57";' service-worker.js
          grep -Fq '/assets/css/community.css?v=14' service-worker.js
          grep -Fq '/assets/css/community-seed.css?v=4' service-worker.js
          grep -Fq '/assets/js/community.js?v=27' service-worker.js
          grep -Fq '/assets/js/community-seed.js?v=7' service-worker.js
          grep -Fq '/assets/js/community-reference.js?v=4' service-worker.js
          grep -Fq '/assets/css/community-reference.css?v=4' service-worker.js
          node <<'NODE'
          const fs = require('fs');
          const sw = fs.readFileSync('service-worker.js', 'utf8');
          if (sw.includes('community-config.js?v=3",\\n')) {
            throw new Error('Literal \\n remains in the Community precache list');
          }
          NODE

      - name: Wait for corrected Community assets to be live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            page="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://thesheemaedit.com/community/?ci=${GITHUB_SHA}" || true)"
            cfg="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://thesheemaedit.com/assets/js/community-config.js?v=4&ci=${GITHUB_SHA}" || true)"
            css="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://thesheemaedit.com/assets/css/community.css?v=14&ci=${GITHUB_SHA}" || true)"
            js="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://thesheemaedit.com/assets/js/community.js?v=27&ci=${GITHUB_SHA}" || true)"
            seed_css="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://thesheemaedit.com/assets/css/community-seed.css?v=4&ci=${GITHUB_SHA}" || true)"
            seed_js="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://thesheemaedit.com/assets/js/community-seed.js?v=7&ci=${GITHUB_SHA}" || true)"
            reference_css="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://thesheemaedit.com/assets/css/community-reference.css?v=4&ci=${GITHUB_SHA}" || true)"
            reference_js="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://thesheemaedit.com/assets/js/community-reference.js?v=4&ci=${GITHUB_SHA}" || true)"
            sw="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://thesheemaedit.com/service-worker.js?ci=${GITHUB_SHA}" || true)"
            paws_media_ok=true
            for media in \
              paws-walk.jpg \
              paws-pillow.jpg \
              paws-bath.jpg \
              paws-cheese.jpg \
              paws-blanket.jpg \
              paws-beach.jpg \
              paws-snow.jpg \
              paws-mood.jpg \
              paws-zoomies.gif \
              paws-treat.gif \
              paws-shake.gif
            do
              if ! curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
                "https://thesheemaedit.com/assets/community/paws/${media}?ci=${GITHUB_SHA}" \
                -o /dev/null; then
                paws_media_ok=false
                break
              fi
            done

            if [ "$paws_media_ok" = true ] \
              && grep -Fq '/assets/css/community.css?v=14' <<<"$page" \
              && grep -Fq '/assets/js/community.js?v=27' <<<"$page" \
              && grep -Fq '/assets/css/community-seed.css?v=4' <<<"$page" \
              && grep -Fq '/assets/js/community-seed.js?v=7' <<<"$page" \
              && grep -Fq '/assets/js/community-reference.js?v=4' <<<"$page" \
              && grep -Fq '/assets/css/community-reference.css?v=4' <<<"$page" \
              && grep -Fq 'id="community-self-profile-dialog"' <<<"$page" \
              && grep -Fq 'class="reference-bottom-nav"' <<<"$page" \
              && grep -Fq '/* Approved reference direction:' <<<"$reference_css" \
              && grep -Fq 'const openProfile = (tab = "posts") =>' <<<"$reference_js" \
              && grep -Fq 'projectId: "the-sheema-edit"' <<<"$cfg" \
              && grep -Fq '/* Social app refresh v3 */' <<<"$css" \
              && grep -Fq 'let reactionCheckedPostIds = new Set();' <<<"$js" \
              && grep -Fq 'comments-sheet-header' <<<"$js" \
              && grep -Fq 'const safeGifUrl = (value = "") =>' <<<"$js" \
              && grep -Fq 'const loadGiphyGifs = async (queryText = "") =>' <<<"$js" \
              && grep -Fq 'giphyApiKey:' <<<"$cfg" \
              && grep -Fq '/* Built-in GIPHY picker */' <<<"$css" \
              && grep -Fq 'comment-gif-trigger' <<<"$js" \
              && grep -Fq 'const neurotypeLabels = {' <<<"$js" \
              && grep -Fq 'const toggleConnection = async (authorId) =>' <<<"$js" \
              && grep -Fq 'const showAuthenticatedShell = (user) =>' <<<"$js" \
              && grep -Fq 'Sparkle powered account' <<<"$seed_js" \
              && grep -Fq 'AI community character powered by Sparkle' <<<"$seed_js" \
              && grep -Fq '/* Sparkle powered Community starter layer */' <<<"$seed_css" \
              && grep -Fq 'const CACHE_NAME = "sheema-edit-v57";' <<<"$sw" \
              && grep -Fq '/assets/css/community.css?v=14' <<<"$sw" \
              && grep -Fq '/assets/css/community-seed.css?v=4' <<<"$sw" \
              && grep -Fq '/assets/js/community.js?v=27' <<<"$sw" \
              && grep -Fq '/assets/js/community-seed.js?v=7' <<<"$sw" \
              && grep -Fq '/assets/js/community-reference.js?v=4' <<<"$sw" \
              && grep -Fq '/assets/css/community-reference.css?v=4' <<<"$sw"; then
              exit 0
            fi
            sleep 10
          done
          echo 'Corrected Community assets did not become live within the verification window.' >&2
          exit 1

      - name: Verify Firebase Auth project and email password provider
        shell: bash
        run: |
          set -euo pipefail
          api_key="$(sed -n 's/.*apiKey: "\([^"]*\)".*/\1/p' assets/js/community-config.js | head -n1)"
          test -n "$api_key"
          response="$(curl -sS --max-time 20 \
            "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=$api_key" \
            -H 'Content-Type: application/json' \
            --data-binary '{"email":"community-ci-probe@example.com","password":"not-a-real-password","returnSecureToken":true}')"
          if grep -Eq 'API_KEY_INVALID|PROJECT_NOT_FOUND|OPERATION_NOT_ALLOWED|CONFIGURATION_NOT_FOUND' <<<"$response"; then
            echo "$response" >&2
            exit 1
          fi
          if ! grep -Eq 'EMAIL_NOT_FOUND|INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|INVALID_EMAIL' <<<"$response"; then
            echo "$response" >&2
            exit 1
          fi

      - name: Verify member data is not anonymously readable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/firestore.json -w '%{http_code}' --max-time 20 \
            'https://firestore.googleapis.com/v1/projects/the-sheema-edit/databases/(default)/documents/profiles?pageSize=1')"
          if [ "$code" = "200" ]; then
            echo 'Firestore profiles are anonymously readable, but the Community is members-only.' >&2
            cat /tmp/firestore.json >&2
            exit 1
          fi
          if [ "$code" != "401" ] && [ "$code" != "403" ]; then
            echo "Unexpected Firestore response: $code" >&2
            cat /tmp/firestore.json >&2
            exit 1
          fi
