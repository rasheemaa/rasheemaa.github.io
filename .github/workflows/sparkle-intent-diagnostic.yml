name: Sparkle intent diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sparkle-intent-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check modified JavaScript syntax
        run: |
          node --check what-do-i-say/chat-app.js
          node --check what-do-i-say/sparkle-quality-hotfix.js

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Capture live runtime diagnostic
        id: diagnose
        continue-on-error: true
        run: |
          set -o pipefail
          node --input-type=module <<'NODE' 2>&1 | tee /tmp/sparkle-intent-diagnostic.txt
          import { webkit } from 'playwright';
          const browser = await webkit.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 820, height: 1180 },
            userAgent: 'Mozilla/5.0 (iPad; CPU OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1',
            serviceWorkers: 'block'
          });
          await context.addInitScript(() => {
            try {
              localStorage.removeItem('wdis_trial_started_at_v2');
              localStorage.removeItem('wdis_founder_session_v1');
              localStorage.removeItem('wdis_pending_founder_session_v1');
            } catch {}
          });
          const page = await context.newPage();
          page.on('pageerror', error => console.log(`PAGEERROR ${error.stack || error.message}`));
          page.on('console', message => console.log(`CONSOLE ${message.type()} ${message.text()}`));
          page.on('requestfailed', request => console.log(`REQUESTFAILED ${request.url()} ${request.failure()?.errorText || ''}`));

          const refusal = text => /(?:as an ai|as a language model|I (?:do not|don't) have (?:the )?(?:ability|capability)|^(?:I(?:'m| am) sorry\s*,?\s*(?:but\s+)?)?I\s+(?:cannot|can['’]?t|cant|am unable to)\s+(?:do that|do this|help with|assist with|lend|loan|send (?:you )?money))/i.test(String(text || '').trim());
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function waitForAnswer(before) {
            await page.waitForFunction(count => {
              const error = document.querySelector('#ai-error');
              if (error && !error.hidden) return true;
              return document.querySelectorAll('.message-row.assistant:not(.working)').length > count && !document.querySelector('#generate')?.disabled;
            }, before, { timeout: 120000 });
            const errorVisible = await page.locator('#ai-error').evaluate(node => !node.hidden);
            const errorText = (await page.locator('#ai-error-message').textContent()) || '';
            if (errorVisible) throw new Error(`Sparkle UI error: ${errorText}`);
            return (await page.locator('.message-row.assistant:not(.working) .bubble').last().textContent())?.trim() || '';
          }

          async function send(text) {
            const before = await page.locator('.message-row.assistant:not(.working)').count();
            await page.locator('#prompt').fill(text);
            await page.locator('#generate').click();
            const output = await waitForAnswer(before);
            console.log(`RESULT ${JSON.stringify({ input: text, output })}`);
            return output;
          }

          async function reset(mode = 'write') {
            if (await page.locator('#new-message-top').isVisible()) await page.locator('#new-message-top').click();
            await page.locator(`[data-mode="${mode}"]`).click();
            console.log(`RESET ${mode}`);
          }

          async function refineButton(label) {
            const current = page.locator('.message-row.assistant:not(.working)').last();
            const more = current.locator('.more-options');
            if ((await more.getAttribute('aria-expanded')) !== 'true') await more.click();
            const before = await page.locator('.message-row.assistant:not(.working)').count();
            await current.locator('.refine-options button').filter({ hasText: label }).click();
            const output = await waitForAnswer(before);
            console.log(`REFINE ${JSON.stringify({ label, output })}`);
            return output;
          }

          try {
            console.log('STEP goto');
            const response = await page.goto(`https://thesheemaedit.com/what-do-i-say/?intent_diag=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
            console.log(`PAGE_STATUS ${response?.status()}`);
            console.log(`SCRIPTS ${JSON.stringify(await page.evaluate(() => [...document.scripts].map(s => s.src || s.getAttribute('src') || '')))}`);
            await page.waitForFunction(() => Boolean(window.Sparkle?.generate), null, { timeout: 30000 });
            console.log(`SPARKLE ${JSON.stringify(await page.evaluate(() => ({ generate: typeof window.Sparkle?.generate, mode: window.Sparkle?.mode || '', name: window.Sparkle?.name || '' })))}`);

            const cases = [
              ['Can you loan me a dollar', /(?:loan|lend|borrow|dollar)/i],
              ['Can you pick me up later', /(?:pick|ride).*(?:later)|later.*(?:pick|ride)/i],
              ["Can you send me twenty dollars and I’ll pay you Friday", /(?:twenty|\$20|20\s+dollars?).*Friday|Friday.*(?:twenty|\$20|20\s+dollars?)/i],
              ["Tell my sister I’m running late", /running late/i],
              ["Sorry, I don’t have it", /(?:sorry|don['’]?t have|do not have)/i],
              ["I don’t want to go tonight but I don’t want to hurt her feelings", /tonight/i],
              ['Can you watch my kid for an hour', /(?:watch|keep an eye on).*(?:kid|child).*(?:hour)|(?:hour).*(?:watch|kid|child)/i],
              ['Can you call me when you get home', /call.*(?:get|home)|(?:get|home).*call/i]
            ];

            for (let i = 0; i < cases.length; i += 1) {
              const [input, expected] = cases[i];
              await reset('write');
              const output = await send(input);
              assert(output.length >= 3, `case ${i + 1} empty output`);
              assert(!refusal(output), `case ${i + 1} capability refusal: ${output}`);
              assert(expected.test(output), `case ${i + 1} lost intent: ${output}`);
              console.log(`PASS_CASE ${i + 1}`);
              await sleep(250);
            }

            await reset('write');
            let current = await send("Can you send me twenty dollars and I’ll pay you Friday");
            const preserve = (value, label) => {
              assert(/Friday/i.test(value), `${label} lost Friday: ${value}`);
              assert(/(?:twenty|\$20|20\s+dollars?)/i.test(value), `${label} lost amount: ${value}`);
              assert(!refusal(value), `${label} became capability refusal: ${value}`);
            };
            preserve(current, 'base');
            for (const label of ['Make it shorter','Make it softer','Make it firmer','Make it professional','Try another version']) {
              current = await refineButton(label);
              preserve(current, label);
              console.log(`PASS_PRESET ${label}`);
              await sleep(250);
            }

            for (const instruction of ['Make that less awkward','Say it nicer','That’s too formal',"Add that I’ll pay them Friday",'Try again but more casual','Make it sound less desperate','I like that one but make it shorter','Make it sound more like me']) {
              current = await send(instruction);
              preserve(current, instruction);
              console.log(`PASS_CUSTOM ${instruction}`);
              await sleep(250);
            }

            await reset('reply');
            const reply = await send('They said: “Can you pick me up tonight?” I want to say I cannot tonight, but I can tomorrow.');
            assert(/tonight/i.test(reply) && /tomorrow/i.test(reply), `Reply lost timing: ${reply}`);
            assert(!refusal(reply), `Reply became capability refusal: ${reply}`);
            console.log('PASS_REPLY');

            await reset('fix');
            const fixed = await send('can you call me when u get home');
            assert(/call/i.test(fixed) && /home/i.test(fixed), `Fix lost intent: ${fixed}`);
            assert(!refusal(fixed), `Fix became capability refusal: ${fixed}`);
            console.log('PASS_FIX');
            console.log('DIAGNOSTIC_SUCCESS');
          } catch (error) {
            console.log(`DIAGNOSTIC_FAILURE ${error?.stack || error}`);
            console.log(`FINAL_URL ${page.url()}`);
            console.log(`FINAL_BODY ${JSON.stringify((await page.locator('body').innerText().catch(() => '')).slice(0,5000))}`);
            throw error;
          } finally {
            await browser.close();
          }
          NODE

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sparkle-intent-diagnostic
          path: /tmp/sparkle-intent-diagnostic.txt
          if-no-files-found: error
          retention-days: 1

      - name: Fail if diagnostic failed
        if: steps.diagnose.outcome != 'success'
        run: exit 1
