name: Sparkle intent diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sparkle-intent-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Verify latest valid draft survives a bad output
        id: diagnose
        continue-on-error: true
        run: |
          set -o pipefail
          node --input-type=module <<'NODE' 2>&1 | tee /tmp/sparkle-state-diagnostic.txt
          import { webkit } from 'playwright';
          const browser = await webkit.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 820, height: 1180 },
            userAgent: 'Mozilla/5.0 (iPad; CPU OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1',
            serviceWorkers: 'block'
          });
          await context.addInitScript(() => {
            try {
              localStorage.removeItem('wdis_trial_started_at_v2');
              localStorage.removeItem('wdis_founder_session_v1');
              localStorage.removeItem('wdis_pending_founder_session_v1');
            } catch {}
          });
          const page = await context.newPage();
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const capabilityRefusal = text => /^(?:I(?:'m| am) sorry\s*,?\s*(?:but\s+)?)?I\s+(?:cannot|can['’]?t|cant|am unable to)\s+(?:do that|do this|help with|assist with)/i.test(String(text || '').trim());

          async function waitForAnswer(before) {
            await page.waitForFunction(count => {
              const error = document.querySelector('#ai-error');
              if (error && !error.hidden) return true;
              return document.querySelectorAll('.message-row.assistant:not(.working)').length > count && !document.querySelector('#generate')?.disabled;
            }, before, { timeout: 30000 });
            const errorVisible = await page.locator('#ai-error').evaluate(node => !node.hidden);
            if (errorVisible) throw new Error((await page.locator('#ai-error-message').textContent()) || 'Sparkle UI error');
            return (await page.locator('.message-row.assistant:not(.working) .bubble').last().textContent())?.trim() || '';
          }

          async function submit(text) {
            const before = await page.locator('.message-row.assistant:not(.working)').count();
            await page.locator('#prompt').fill(text);
            await page.locator('#generate').click();
            return waitForAnswer(before);
          }

          try {
            await page.goto(`https://thesheemaedit.com/what-do-i-say/?state_diag=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => Boolean(window.Sparkle?.generate), null, { timeout: 30000 });
            const scripts = await page.evaluate(() => [...document.scripts].map(s => s.getAttribute('src') || ''));
            assert(scripts.some(src => src.includes('chat-app.js?v=25')), 'Live page is not using chat-app v25');

            await page.evaluate(() => {
              let calls = 0;
              window.__sparkleStatePayloads = [];
              window.Sparkle = {
                generate: async payload => {
                  calls += 1;
                  window.__sparkleStatePayloads.push(JSON.parse(JSON.stringify(payload)));
                  if (calls === 1) return 'Can you pick me up later?';
                  if (calls === 2) return "I'm sorry, but I can't do that.";
                  if (calls === 3) return 'Could you pick me up later?';
                  return 'Could you please pick me up later?';
                },
                cancel: () => {}
              };
            });

            const first = await submit('Can you pick me up later');
            assert(first === 'Can you pick me up later?', `Unexpected first draft: ${first}`);
            const firstRow = page.locator('.message-row.assistant:not(.working)').last();
            assert((await firstRow.locator('.response-actions').count()) === 1, 'Valid first draft has no refinement controls');
            console.log('PASS first valid draft is refinable');

            const bad = await submit('Make it softer');
            assert(capabilityRefusal(bad), `Injected bad output did not appear: ${bad}`);
            const badRow = page.locator('.message-row.assistant:not(.working)').last();
            assert((await badRow.locator('.response-actions').count()) === 0, 'Bad capability refusal incorrectly received refinement controls');
            console.log('PASS bad output is displayed but is not refinable');

            const recovered = await submit('Make it shorter');
            assert(recovered === 'Could you pick me up later?', `Unexpected recovery draft: ${recovered}`);
            let payloads = await page.evaluate(() => window.__sparkleStatePayloads);
            console.log(`PAYLOADS_AFTER_RECOVERY ${JSON.stringify(payloads)}`);
            assert(payloads.length === 3, `Expected three generation calls, got ${payloads.length}`);
            assert(payloads[2].currentMessage === 'Can you pick me up later?', `Bad output poisoned canonical state: ${JSON.stringify(payloads[2])}`);
            console.log('PASS later freeform edit uses the latest valid draft, not the bad refusal');

            const firstMore = firstRow.locator('.more-options');
            if ((await firstMore.getAttribute('aria-expanded')) !== 'true') await firstMore.click();
            const before = await page.locator('.message-row.assistant:not(.working)').count();
            await firstRow.locator('.refine-options button').filter({ hasText: 'Make it professional' }).click();
            const staleControlResult = await waitForAnswer(before);
            assert(staleControlResult === 'Could you please pick me up later?', `Unexpected stale-control result: ${staleControlResult}`);
            payloads = await page.evaluate(() => window.__sparkleStatePayloads);
            console.log(`PAYLOADS_FINAL ${JSON.stringify(payloads)}`);
            assert(payloads.length === 4, `Expected four generation calls, got ${payloads.length}`);
            assert(payloads[3].currentMessage === 'Could you pick me up later?', `Older controls reverted canonical state: ${JSON.stringify(payloads[3])}`);
            console.log('PASS older refinement controls still operate on the latest valid draft');
            console.log('STATE_DIAGNOSTIC_SUCCESS');
          } catch (error) {
            console.log(`STATE_DIAGNOSTIC_FAILURE ${error?.stack || error}`);
            throw error;
          } finally {
            await browser.close();
          }
          NODE

      - name: Upload state diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sparkle-state-diagnostic
          path: /tmp/sparkle-state-diagnostic.txt
          if-no-files-found: error
          retention-days: 1

      - name: Fail if diagnostic failed
        if: steps.diagnose.outcome != 'success'
        run: exit 1
