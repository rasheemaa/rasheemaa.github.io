name: Sparkle startup diagnostic

on:
  push:
    paths:
      - '.github/workflows/sparkle-startup-diagnostic.yml'
      - '.github/scripts/sparkle-startup-diagnostic.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact repository revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install exact Playwright version
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Diagnose live Sparkle startup
        run: node .github/scripts/sparkle-startup-diagnostic.mjs
