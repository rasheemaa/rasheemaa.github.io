name: Sparkle WebKit production verification

on:
  push:
    paths:
      - '.github/workflows/sparkle-webkit-verify.yml'
      - '.github/scripts/sparkle-smoke.mjs'
      - '.github/scripts/sparkle-compatibility-test.mjs'
      - 'what-do-i-say/index.html'
      - 'what-do-i-say/bootstrap.js'
      - 'what-do-i-say/config.js'
      - 'what-do-i-say/payment.js'
      - 'what-do-i-say/chat-app.js'
      - 'what-do-i-say/styles.css'
      - 'what-do-i-say/sparkle.css'
      - 'what-do-i-say/trust.css'
      - 'what-do-i-say/sparkle.js'
      - 'what-do-i-say/sparkle-quality-hotfix.js'
      - 'what-do-i-say/sparkle-worker.js'
      - 'what-do-i-say/sparkle-mobile-worker.js'
      - 'what-do-i-say/sparkle-mobile-worker-v2.js'
      - 'what-do-i-say/service-worker.js'
      - 'what-do-i-say/manifest.webmanifest'
      - 'what-do-i-say/privacy/**'
      - 'what-do-i-say/terms/**'
      - 'what-do-i-say/refunds/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sparkle-webkit-production-main
  cancel-in-progress: true

jobs:
  webkit-production-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact repository revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Wait for exact WebKit production revision
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const base = 'https://thesheemaedit.com/what-do-i-say/';
          const files = [
            'bootstrap.js',
            'config.js',
            'payment.js',
            'chat-app.js',
            'styles.css',
            'sparkle.css',
            'trust.css',
            'sparkle.js',
            'sparkle-quality-hotfix.js',
            'sparkle-worker.js',
            'sparkle-mobile-worker.js',
            'sparkle-mobile-worker-v2.js',
            'service-worker.js',
            'manifest.webmanifest'
          ];
          const expected = new Map();
          for (const file of files) {
            expected.set(file, (await readFile(`what-do-i-say/${file}`, 'utf8')).trim());
          }

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let lastMismatch = 'production revision is not ready yet';

          for (let attempt = 1; attempt <= 48; attempt += 1) {
            try {
              let mismatch = '';
              for (const file of files) {
                const response = await fetch(`${base}${file}?webkit_verify=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) {
                  mismatch = `${file} returned ${response.status}`;
                  break;
                }
                const actual = (await response.text()).trim();
                if (actual !== expected.get(file)) {
                  mismatch = `${file} does not match the checked out revision`;
                  break;
                }
              }

              if (!mismatch) {
                const page = await fetch(`${base}?webkit_verify=${Date.now()}`, { cache: 'no-store' });
                if (!page.ok) mismatch = `What Do I Say page returned ${page.status}`;
                else {
                  const html = await page.text();
                  if (!/bootstrap\.js\?v=2/.test(html)) mismatch = 'Production HTML is not loading bootstrap.js?v=2';
                  else if (!/sparkle\.js\?v=22/.test(html)) mismatch = 'Production HTML is not loading sparkle.js?v=22';
                  else if (!/sparkle-quality-hotfix\.js\?v=3/.test(html)) mismatch = 'Production HTML is not loading sparkle-quality-hotfix.js?v=3';
                  else if (!/chat-app\.js\?v=24/.test(html)) mismatch = 'Production HTML is not loading chat-app.js?v=24';
                  else if (!/styles\.css\?v=10/.test(html)) mismatch = 'Production HTML is not loading styles.css?v=10';
                  else if (!/trust\.css\?v=1/.test(html)) mismatch = 'Production HTML is not loading trust.css?v=1';
                  else if (!/config\.js\?v=9/.test(html)) mismatch = 'Production HTML is not loading config.js?v=9';
                  else if (!/payment\.js\?v=2/.test(html)) mismatch = 'Production HTML is not loading payment.js?v=2';
                  else if (!/\/what-do-i-say\/privacy\//.test(html)) mismatch = 'Production HTML is missing the Privacy link';
                  else if (!/\/what-do-i-say\/terms\//.test(html)) mismatch = 'Production HTML is missing the Terms link';
                  else if (!/\/what-do-i-say\/refunds\//.test(html)) mismatch = 'Production HTML is missing the Refunds link';
                  else if (/vercel/i.test(html)) mismatch = 'Production What Do I Say HTML still references Vercel';
                }
              }

              if (!mismatch) {
                for (const file of files) console.log(`PASS production ${file} matches repository`);
                console.log('PASS production HTML loads current chat, payment, trust, policy assets and contains no Vercel reference');
                process.exit(0);
              }
              lastMismatch = mismatch;
            } catch (error) {
              lastMismatch = String(error?.message || error);
            }

            console.log(`Production check ${attempt}/48: ${lastMismatch}`);
            if (attempt < 48) await sleep(10_000);
          }

          throw new Error(`Pages did not deploy the exact WebKit revision: ${lastMismatch}`);
          NODE

      - name: Verify compatibility recovery logic
        run: node .github/scripts/sparkle-compatibility-test.mjs

      - name: Install Playwright WebKit
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Run full customer flow through WebKit with iPad Safari identity
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          let code = await readFile('.github/scripts/sparkle-smoke.mjs', 'utf8');
          code = code.replace("import { chromium } from 'playwright';", "import { webkit as chromium } from 'playwright';");
          code = code.replace("const browser = await chromium.launch({ headless: true, args: ['--disable-dev-shm-usage'] });", "const browser = await chromium.launch({ headless: true });");
          code = code.replace("userAgent = 'Sparkle-Smoke-Test/1.0 Chrome'", "userAgent = 'Mozilla/5.0 (iPad; CPU OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'");
          code = code.replace("page.on('console', message => { if (message.type() === 'error') browserErrors.push(`console: ${message.text()}`); });", "page.on('console', message => { if (message.type() === 'error' && !/Failed to load resource:.*status of 400/i.test(message.text())) browserErrors.push(`console: ${message.text()}`); });");
          await writeFile('.github/scripts/.sparkle-webkit-runtime.mjs', code);
          NODE
          node .github/scripts/.sparkle-webkit-runtime.mjs
