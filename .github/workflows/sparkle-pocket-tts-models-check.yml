name: Sparkle Pocket TTS model network and cache (isolated)

on:
  push:
    branches:
      - "test/sparkle-pr9-real-pocket-tts-20261013"
    paths:
      - ".github/workflows/sparkle-pocket-tts-models-check.yml"
      - ".github/scripts/sparkle-pocket-tts-prefetch.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sparkle-pocket-tts-models-test
  cancel-in-progress: false

jobs:
  reachability-and-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SPARKLE_MODEL_CACHE_DIR: .cache/sparkle-pocket-tts
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Restore downloaded model weight cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: .cache/sparkle-pocket-tts
          key: sparkle-pocket-tts-english-2026-04-qmixed-v1-${{ runner.os }}
      - name: Check host reachability and prefetch exact Sparkle model weights
        run: python3 .github/scripts/sparkle-pocket-tts-prefetch.py
      - name: Summarize cache and model access
        if: always()
        shell: bash
        run: |
          echo '### Sparkle Pocket TTS model host check' >> "$GITHUB_STEP_SUMMARY"
          if [ -f .cache/sparkle-pocket-tts/english_2026-04/sha256-manifest.json ]; then
            echo 'Verified assets are available in the isolated runner cache directory.' >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('.cache/sparkle-pocket-tts/english_2026-04/sha256-manifest.json')
          data=json.loads(path.read_text())
          print('Cached assets:', len(data))
          print('Total verified bytes:', sum(x['bytes'] for x in data.values()))
          PY
          else
            echo 'Download did not complete. Inspect the DNS/HTTP diagnostics in job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
