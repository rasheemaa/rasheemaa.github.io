name: Editorial design verification
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Consolidate presentation
        run: python3 .github/scripts/editorial-cleanup.py
      - name: Save presentation cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --cached --quiet || git commit -m 'Finish sitewide editorial cleanup and signatures'
          git push
      - name: Install layout checker
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Check live desktop and mobile pages
        run: node .github/scripts/editorial-verify.mjs
      - name: Save verification results
        if: always()
        run: |
          git add .github/reports assets/design-previews || true
          git diff --cached --quiet || git commit -m 'Save editorial desktop and mobile previews and checks'
          git pull --rebase
          git push
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: editorial-previews
          path: |
            assets/design-previews
            .github/reports
