name: Verify phone and desktop layouts

on:
  pull_request:
    paths:
      - .github/workflows/mobile-check.yml
      - .github/scripts/brand-mobile-verify.mjs
      - assets/css/editorial.css
      - assets/css/home-editorial.css
      - assets/js/main.js
      - index.html
      - about.html
      - _layouts/post.html
      - shop/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Import published guides
        run: python3 .github/scripts/import_ryze.py
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./
          destination: ./_site
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.64.1 && npx playwright install --with-deps chromium webkit
      - name: Verify the built site at phone and desktop widths
        run: |
          python3 -m http.server 4173 --directory _site > "$RUNNER_TEMP/sheema-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          node .github/scripts/brand-mobile-verify.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: brand-mobile-verification
          path: .github/reports/brand-mobile/
          include-hidden-files: true
          retention-days: 1
