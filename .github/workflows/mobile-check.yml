name: Verify mobile refinement
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mobile-editorial-checks
          run-id: 39732122922
          github-token: ${{ github.token }}
          path: previous-checks
      - run: cp previous-checks/.github/reports/baseline-*.png .github/reports/
      - run: node .github/scripts/mobile-verify.mjs after
      - name: Save screenshots
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/reports/mobile-after.json assets/mobile-previews || true
          git diff --cached --quiet || git commit -m 'Save verified phone screenshots and laptop parity results'
          git pull --rebase
          git push
