name: Sparkle Another one-shot hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sparkle-another-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch unchanged Another result and bust runtime cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          sparkle = Path('what-do-i-say/sparkle.js')
          text = sparkle.read_text()
          needle = """        message = repairRefinementPolarity(message, item.payload);\n        message = repairCourtesy(message);\n        if (!message) {"""
          replacement = """        message = repairRefinementPolarity(message, item.payload);\n        message = repairCourtesy(message);\n        if (item.payload?.refine === 'another') {\n          const normalized = message.toLowerCase().replace(/[^\\p{L}\\p{N}]/gu, '');\n          const previous = String(item.payload.currentMessage || '').toLowerCase().replace(/[^\\p{L}\\p{N}]/gu, '');\n          if (normalized === previous) {\n            const fallback = alternateWordingFallback(item.payload.currentMessage, item.payload);\n            if (fallback) message = fallback;\n          }\n        }\n        if (!message) {"""
          if needle not in text:
              raise SystemExit('sparkle.js insertion point not found')
          sparkle.write_text(text.replace(needle, replacement, 1))

          index = Path('what-do-i-say/index.html')
          html = index.read_text()
          old = '/what-do-i-say/sparkle.js?v=14'
          new = '/what-do-i-say/sparkle.js?v=15'
          if old not in html:
              raise SystemExit('index.html Sparkle asset version not found')
          index.write_text(html.replace(old, new, 1))

          smoke = Path('.github/scripts/sparkle-smoke.mjs')
          test = smoke.read_text()
          if "sparkle.js?v=14" not in test:
              raise SystemExit('smoke expected Sparkle version not found')
          smoke.write_text(test.replace('sparkle.js?v=14', 'sparkle.js?v=15', 1))
          PY
      - name: Commit hotfix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/sparkle-another-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add what-do-i-say/sparkle.js what-do-i-say/index.html .github/scripts/sparkle-smoke.mjs .github/workflows/sparkle-another-hotfix.yml
          git commit -m 'Prevent unchanged Another refinements from stalling live flow'
          git push origin HEAD:main
