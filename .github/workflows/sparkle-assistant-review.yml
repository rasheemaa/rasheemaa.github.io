name: Sparkle assistant frontend review

on:
  pull_request:
    paths:
      - 'what-do-i-say/index.html'
      - 'what-do-i-say/chat-app.js'
      - 'what-do-i-say/assistant-client.js'
      - 'what-do-i-say/site-draft.js'
      - 'what-do-i-say/styles.css'
      - '.github/scripts/sparkle-assistant-test.mjs'
      - '.github/scripts/sparkle-assistant-conversation-test.mjs'
      - '.github/scripts/sparkle-assistant-browser-test.mjs'
      - '.github/workflows/sparkle-assistant-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assistant-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Check browser JavaScript syntax
        run: |
          node --check what-do-i-say/chat-app.js
          node --check what-do-i-say/assistant-client.js
          node --check what-do-i-say/site-draft.js
      - name: Exercise assistant client, safe website drafts and actual chat routing
        run: |
          node .github/scripts/sparkle-assistant-test.mjs
          node .github/scripts/sparkle-assistant-conversation-test.mjs
      - name: Preserve old writing behavior
        run: |
          node .github/scripts/free-access-smoke.mjs
          node .github/scripts/sparkle-message-meaning-test.mjs

      - name: Install browser test engines
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Verify desktop and simulated iPhone WebKit interactions
        run: node .github/scripts/sparkle-assistant-browser-test.mjs
