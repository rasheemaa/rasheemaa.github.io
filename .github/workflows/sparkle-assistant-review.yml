name: Sparkle assistant frontend review

on:
  pull_request:
    paths:
      - 'what-do-i-say/index.html'
      - 'what-do-i-say/chat-app.js'
      - 'what-do-i-say/assistant-client.js'
      - 'what-do-i-say/site-draft.js'
      - 'what-do-i-say/styles.css'
      - '.github/scripts/sparkle-assistant-test.mjs'
      - '.github/workflows/sparkle-assistant-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assistant-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Check browser JavaScript syntax
        run: |
          node --check what-do-i-say/chat-app.js
          node --check what-do-i-say/assistant-client.js
          node --check what-do-i-say/site-draft.js
      - name: Exercise assistant client and safe HTML exporter
        run: node .github/scripts/sparkle-assistant-test.mjs
