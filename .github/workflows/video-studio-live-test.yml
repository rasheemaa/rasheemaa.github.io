name: Sparkle Video Studio generation safety gate

on:
  push:
    branches:
      - 'feature/sparkle-video-studio-free-prototype'
    paths:
      - 'what-do-i-say/video-studio/**'
      - '.github/workflows/video-studio-live-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prohibit-unmoderated-video-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check generation remains locked
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('what-do-i-say/video-studio/index.html').read_text()
          js = Path('what-do-i-say/video-studio/studio.js').read_text()
          assert 'frame-src \'none\'' in html
          assert 'const safetyLocked = true' in js
          assert re.search(r'<button id="prepare"[^>]*disabled', html)
          assert '<iframe' not in html
          assert 'https://huggingface.co/spaces/' not in html
          assert 'https://lightricks-ltx-2-3.hf.space/' not in html
          print('PASS: no unmoderated video provider is accessible from Sparkle Video Studio')
          PY
