name: Sparkle Creator preview checks
on:
  pull_request:
    paths:
      - 'what-do-i-say/creator-preview/**'
      - 'what-do-i-say/chat-app.js'
      - 'what-do-i-say/index.html'
      - 'what-do-i-say/simple-home.*'
      - 'what-do-i-say/service-worker.js'
      - 'assets/css/tool-editorial.css'
      - '.github/workflows/sparkle-creator-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  creator-static:
    runs-on: ubuntu-latest
    container:
      # Official Playwright v1.64.1-noble, including matching browsers and system libraries.
      image: mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --shm-size=1g
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate creator preview
        run: |
          node --check what-do-i-say/creator-preview/ai.js
          node --check what-do-i-say/creator-preview/app.js
          node --check what-do-i-say/creator-preview/config.js
          node --check what-do-i-say/creator-preview/drafts.js
          node --check what-do-i-say/creator-preview/projects.js
          node --check what-do-i-say/creator-preview/backups.js
          node --check what-do-i-say/creator-preview/profile.js
          node --check what-do-i-say/chat-app.js
          node --check what-do-i-say/simple-home.js
          node what-do-i-say/simple-home.test.cjs
          node what-do-i-say/creator-preview/smoke.test.cjs
          node what-do-i-say/creator-preview/storage.test.cjs
          node what-do-i-say/creator-preview/drafts.test.cjs
          node what-do-i-say/creator-preview/ai.test.cjs
          node what-do-i-say/creator-preview/backups.test.cjs
      - name: Install pinned browsers and accessibility checks
        timeout-minutes: 8
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.64.1 @axe-core/playwright@4.14.0
      - name: Verify simulated phone and desktop interactions and accessibility
        timeout-minutes: 6
        env:
          CREATOR_BROWSER_TEST: '1'
        run: node what-do-i-say/creator-preview/smoke.test.cjs
      - name: Save screenshots and browser results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sparkle-creator-studio
          path: .github/reports/creator-studio/
          retention-days: 1
