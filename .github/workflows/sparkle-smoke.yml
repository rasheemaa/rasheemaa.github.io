name: Sparkle live smoke test

on:
  push:
    paths:
      - '.github/workflows/sparkle-smoke.yml'
      - '.github/scripts/sparkle-smoke.mjs'
      - 'what-do-i-say/index.html'
      - 'what-do-i-say/config.js'
      - 'what-do-i-say/app.js'
      - 'what-do-i-say/sparkle.js'
      - 'what-do-i-say/sparkle-worker.js'
      - 'what-do-i-say/service-worker.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sparkle-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test tuned Sparkle live end to end
        run: node .github/scripts/sparkle-smoke.mjs
