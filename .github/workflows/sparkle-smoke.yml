name: Sparkle live smoke test

on:
  push:
    paths:
      - '.github/workflows/sparkle-smoke.yml'
      - '.github/scripts/sparkle-smoke.mjs'
      - '.github/scripts/sparkle-compatibility-test.mjs'
      - '.github/scripts/sparkle-targeted-retry.mjs'
      - '.github/scripts/sparkle-targeted-mobile.mjs'
      - 'what-do-i-say/index.html'
      - 'what-do-i-say/bootstrap.js'
      - 'what-do-i-say/config.js'
      - 'what-do-i-say/app.js'
      - 'what-do-i-say/sparkle.js'
      - 'what-do-i-say/sparkle-worker.js'
      - 'what-do-i-say/styles.css'
      - 'what-do-i-say/sparkle.css'
      - 'what-do-i-say/service-worker.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sparkle-live-smoke-main
  cancel-in-progress: true

jobs:
  sparkle-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Verify compatibility recovery without downloading a model
        run: node .github/scripts/sparkle-compatibility-test.mjs

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.55.0

      - name: Install exact Playwright version without package lifecycle scripts
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test targeted Sparkle mobile UI live
        if: contains(github.event.head_commit.message, '[sparkle-mobile]')
        run: node .github/scripts/sparkle-targeted-mobile.mjs

      - name: Test targeted Sparkle retry refusal live
        if: ${{ contains(github.event.head_commit.message, '[sparkle-targeted]') && !contains(github.event.head_commit.message, '[sparkle-mobile]') }}
        run: node .github/scripts/sparkle-targeted-retry.mjs

      - name: Test tuned Sparkle live end to end
        if: ${{ !contains(github.event.head_commit.message, '[sparkle-targeted]') && !contains(github.event.head_commit.message, '[sparkle-mobile]') }}
        run: node .github/scripts/sparkle-smoke.mjs
