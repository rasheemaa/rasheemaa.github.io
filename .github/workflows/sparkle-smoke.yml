name: Sparkle live smoke test

on:
  push:
    paths:
      - '.github/workflows/sparkle-smoke.yml'
      - '.github/scripts/sparkle-smoke.mjs'
      - '.github/scripts/sparkle-targeted-retry.mjs'
      - '.github/scripts/sparkle-targeted-mobile.mjs'
      - 'what-do-i-say/index.html'
      - 'what-do-i-say/config.js'
      - 'what-do-i-say/app.js'
      - 'what-do-i-say/sparkle.js'
      - 'what-do-i-say/sparkle-worker.js'
      - 'what-do-i-say/styles.css'
      - 'what-do-i-say/sparkle.css'
      - 'what-do-i-say/service-worker.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sparkle-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.55.0

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test targeted Sparkle mobile UI live
        if: contains(github.event.head_commit.message, '[sparkle-mobile]')
        run: node .github/scripts/sparkle-targeted-mobile.mjs

      - name: Test targeted Sparkle retry refusal live
        if: ${{ contains(github.event.head_commit.message, '[sparkle-targeted]') && !contains(github.event.head_commit.message, '[sparkle-mobile]') }}
        run: node .github/scripts/sparkle-targeted-retry.mjs

      - name: Test tuned Sparkle live end to end
        if: ${{ !contains(github.event.head_commit.message, '[sparkle-targeted]') && !contains(github.event.head_commit.message, '[sparkle-mobile]') }}
        run: node .github/scripts/sparkle-smoke.mjs
