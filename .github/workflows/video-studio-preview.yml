name: Sparkle Video Studio safety hold

on:
  pull_request:
    paths:
      - 'what-do-i-say/video-studio/**'
      - 'what-do-i-say/index.html'
      - '.github/scripts/video-studio-smoke.mjs'
      - '.github/workflows/video-studio-preview.yml'
      - '.github/workflows/video-studio-live-test.yml'
  push:
    branches:
      - 'feature/sparkle-video-studio-free-prototype'
    paths:
      - 'what-do-i-say/video-studio/**'
      - '.github/scripts/video-studio-smoke.mjs'
      - '.github/workflows/video-studio-preview.yml'
      - '.github/workflows/video-studio-live-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce-video-safety-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Verify no unmoderated generation or provider handoff
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const html=readFileSync('what-do-i-say/video-studio/index.html','utf8');
          const js=readFileSync('what-do-i-say/video-studio/studio.js','utf8');
          const live=readFileSync('.github/workflows/video-studio-live-test.yml','utf8');
          assert.match(html,/frame-src 'none'/);
          assert.match(html,/Video creation is paused/);
          assert.match(html,/minors/);
          assert.match(html,/sexual violence/i);
          assert.match(html,/server-side screening/);
          assert.doesNotMatch(html,/<(?:iframe|script|textarea|input|form|button|video)\b/i);
          assert.doesNotMatch(html,/https:\/\/(?:huggingface\.co|lightricks-ltx-2-3\.hf\.space)/i);
          assert.doesNotMatch(js,/\bfetch\s*\(|XMLHttpRequest|\.workers\.dev|stripe|checkout|api[_-]?key/i);
          console.log('PASS: Video generation stays fully disabled without a trusted safety pipeline');
          NODE
      - name: Install browser test tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Test safe disabled Video Studio on desktop and mobile
        run: node .github/scripts/video-studio-smoke.mjs
