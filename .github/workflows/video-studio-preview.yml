name: Sparkle Video Studio safety lock

on:
  pull_request:
    paths:
      - 'what-do-i-say/video-studio/**'
      - 'what-do-i-say/index.html'
      - '.github/scripts/video-studio-smoke.mjs'
      - '.github/workflows/video-studio-preview.yml'
  push:
    branches:
      - 'feature/sparkle-video-studio-free-prototype'
    paths:
      - 'what-do-i-say/video-studio/**'
      - 'what-do-i-say/index.html'
      - '.github/scripts/video-studio-smoke.mjs'
      - '.github/workflows/video-studio-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-studio-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Verify strict video safety lock and zero external providers
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const html=readFileSync('what-do-i-say/video-studio/index.html','utf8');
          const js=readFileSync('what-do-i-say/video-studio/studio.js','utf8');
          assert.match(html,/frame-src 'none'/);
          assert.match(html,/id="prepare"[^>]*disabled/);
          assert.match(html,/No depictions of minors/);
          assert.match(html,/No sexual violence/);
          assert.match(js,/const safetyLocked = true/);
          assert.doesNotMatch(html,/<iframe|lightricks-ltx-2-3\.hf\.space|huggingface\.co\/spaces\//i);
          assert.doesNotMatch(js,/\bfetch\s*\(|XMLHttpRequest|\.workers\.dev|stripe|checkout|api[_-]?key/i);
          assert.match(html,/No paid APIs/);
          console.log('PASS: Video Studio remains locked until server-side safety is verified');
          NODE

      - name: Install browser test tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Test safety lock across responsive browsers without generating video
        run: node .github/scripts/video-studio-smoke.mjs

