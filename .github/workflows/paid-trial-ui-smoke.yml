name: Sparkle free access UI smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paid-trial-ui-smoke.yml'
      - 'index.html'
      - 'service-worker.js'
      - 'assets/js/main.js'
      - 'assets/js/wdis-launch-popup.js'
      - 'shop/index.html'
      - '.github/scripts/free-access-smoke.mjs'
      - 'what-do-i-say/index.html'
      - 'what-do-i-say/service-worker.js'
      - 'what-do-i-say/terms.html'
      - 'what-do-i-say/refunds.html'
      - 'what-do-i-say/privacy.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wdis-paid-trial-live-ui
  cancel-in-progress: true

jobs:
  paid-trial-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Verify free access for everyone
        run: node .github/scripts/free-access-smoke.mjs
